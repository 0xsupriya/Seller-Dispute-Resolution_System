<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Dispute Resolution</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Seller Dispute Resolution</h1>
  </header>

  <main>
    <section class="card">
      <h2>Disputes</h2>
      <div id="disputeList"></div>
    </section>

    <section class="card" id="detailSection" hidden>
      <h2>Dispute Details</h2>
      <div id="detailMeta"></div>
      <div class="images" id="imageGrid"></div>
      <div class="row">
        <button id="downloadBtn">Download Images</button>
        <button id="analyzeBtn">Run Analysis</button>
      </div>

      <h3>Human Review</h3>
      <label>Decision
        <select id="reviewDecision">
          <option value="approved">Approved</option>
          <option value="overridden">Overridden</option>
          <option value="rejected">Rejected</option>
        </select>
      </label>
      <label>Final compensation %
        <input type="number" id="reviewPct" min="0" max="100" step="1" />
      </label>
      <label>Notes
        <textarea id="reviewNotes" rows="3" placeholder="Optional notes"></textarea>
      </label>
      <button id="saveReviewBtn">Save Review</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
